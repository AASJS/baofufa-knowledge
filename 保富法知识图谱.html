<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保富法 · 知识图谱（可隐藏 · 沉浸阅读）</title>
<style>
:root{
  --bg:#f7f4ee; --paper:#fffdf8; --ink:#2b2620; --muted:#8a8071;
  --line:#d9cfbe; --person:#3f5ea8; --person-soft:#e7edfa;
  --event:#c96a3b; --event-soft:#fbe9df; --yili:#a9854f; --yili-soft:#f5ecd9; --gold:#a9854f; --accent:#5c4326;
  --graph-w:55vw;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC","WenQuanYi Micro Hei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100vh;width:100vw;overflow:hidden}

/* ===== 图谱区：宽度可调 / 可隐藏 ===== */
#stage{position:relative;flex:none;width:var(--graph-w);min-width:0;background:radial-gradient(ellipse at 22% 18%, #fffdf7 0%, #f4efe4 55%, #ebe3d3 100%);overflow:hidden;transition:width .34s cubic-bezier(.4,0,.2,1)}
#app.resizing #stage{transition:none}
#app.graph-hidden #stage{width:0}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}
.edge{stroke:#c2b8a6;stroke-width:.4;opacity:.11;transition:opacity .18s,stroke .18s}
.edge.hot{stroke:var(--gold);stroke-width:1.3;opacity:.95}
.edge.dim{opacity:.02}
.edges-off .edge{opacity:0 !important}
.node{cursor:pointer}
.node circle{stroke:#fffdf8;stroke-width:1.6;transition:opacity .18s,stroke .18s}
.node .hit{fill:rgba(0,0,0,0);stroke:none;pointer-events:all}
.node text{pointer-events:none;font-size:10.5px;fill:#5c5142;paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round;font-weight:500;transition:opacity .18s}
.node.major text{font-size:15px;fill:#2b2620;font-weight:700}
.node.mid text{font-size:12px;fill:#3b342a;font-weight:600}
.node.minor text{font-size:10px;fill:#6b6154;font-weight:500}
.node .lbl{opacity:.92}
.node.major .lbl{opacity:1}
.node.mid .lbl{opacity:.96}
.labels-minimal .node.minor:not(.hovered):not(.sel):not(.hot) .lbl{opacity:0}
.node.hovered .lbl,.node.sel .lbl,.node.hot .lbl{opacity:1;fill:#1d1812;font-size:15px}
.node.dim{opacity:.12}
.node.hot circle:not(.hit){stroke:var(--accent);stroke-width:3}
.node.sel circle:not(.hit){stroke:#2b2620;stroke-width:3.4}
.node circle.hit,.node.hot circle.hit,.node.sel circle.hit,.node.hovered circle.hit{fill:rgba(0,0,0,0)!important;stroke:none!important;pointer-events:all}
#bar{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5;background:linear-gradient(180deg,rgba(247,244,238,.96),rgba(247,244,238,0));pointer-events:none}
.card{background:rgba(255,253,248,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:auto}
#search{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;width:210px;outline:none;background:#fff}
#search:focus{border-color:var(--gold)}
.seg,.toggles{display:flex;gap:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;color:#5a5145;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.icon{font-weight:700;letter-spacing:.5px}
.legend{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.p{background:var(--person)} .dot.y{background:var(--yili)} .dot.e{background:var(--event)}
.hint{font-size:12px;color:var(--muted)}
.title-badge{font-size:12px;color:var(--gold);letter-spacing:2px;font-weight:600}

/* ===== 水平滑动手柄 ===== */
#resizer{flex:none;width:9px;position:relative;z-index:7;cursor:col-resize;background:transparent;touch-action:none}
#resizer::before{content:"";position:absolute;top:0;bottom:0;left:3px;right:3px;background:var(--line);opacity:.6;transition:background .18s,opacity .18s}
#resizer::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:46px;border-radius:3px;background:var(--gold);opacity:.6}
#resizer:hover::before,#app.resizing #resizer::before{background:var(--gold);opacity:.95}
#resizer:hover::after,#app.resizing #resizer::after{opacity:1}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}

/* ===== 移动端图谱抽屉：浮动开关 + 遮罩（仅手机显示） ===== */
.fab-graph{display:none;position:fixed;top:14px;right:14px;z-index:40;align-items:center;gap:6px;padding:10px 15px;border:1px solid var(--gold);border-radius:22px;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);color:var(--accent);font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(92,67,38,.18);cursor:pointer;transition:transform .15s,background .15s;-webkit-tap-highlight-color:transparent}
.fab-graph::before{content:"◧";font-size:16px;line-height:1}
.fab-graph.on::before{content:"✕"}
.fab-graph:active{transform:scale(.94)}
#scrim{display:none}

/* ===== 阅读面板 · 自适应占满 ===== */
#panel{flex:1;min-width:0;background:var(--paper);display:flex;flex-direction:column;z-index:6;border-left:1px solid transparent;transition:border-color .3s}
#app:not(.graph-hidden) #panel{border-left-color:var(--line)}
#panel .ph{padding:26px 34px 20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fffdf8,#f7f0e3);position:relative}
.ph-inner{max-width:820px;margin:0 auto;position:relative}
#panel h1{margin:0;font-size:28px;line-height:1.3;letter-spacing:1px;color:var(--accent)}
.sub{font-size:13px;color:var(--gold);letter-spacing:1.5px;margin-top:6px}
.badge{display:inline-block;font-size:13px;padding:5px 14px;border-radius:20px;font-weight:600;margin-top:12px}
.badge.p{background:var(--person-soft);color:var(--person)}
.badge.y{background:var(--yili-soft);color:var(--yili)}
.badge.e{background:var(--event-soft);color:var(--event)}
#panel .pb{padding:26px 34px 44px;overflow-y:auto;flex:1;scroll-behavior:smooth}
.reader{max-width:820px;margin:0 auto}
.show-graph-btn{position:absolute;top:2px;right:0;font-size:13px;padding:8px 15px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--accent);display:none;align-items:center;gap:6px;transition:.15s;font-weight:600}
.show-graph-btn:hover{border-color:var(--gold);background:#faf6ec;transform:translateY(-1px)}
#app.graph-hidden .show-graph-btn{display:inline-flex}

/* 导语：唯一强调，小面积金色 */
.sum{font-size:17px;line-height:1.8;color:#54493a;margin:0 0 22px;padding:14px 18px;background:#faf6ec;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;letter-spacing:.3px}
.meta-row{display:flex;gap:32px;font-size:13px;color:var(--muted);margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta-row b{color:var(--accent);font-size:20px;display:block;margin-top:3px;letter-spacing:.5px}
/* md 正文 —— 宋体正文 / 黑体标题 */
.md-content{font-family:"Songti SC","STSong","Source Han Serif SC","思源宋体","Noto Serif CJK SC","SimSun","宋体",serif;font-size:18px;line-height:1.8;color:#2b2620;margin:0 0 30px;letter-spacing:.5px}
.md-content h2{font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:21px;line-height:1.4;color:var(--accent);margin:34px 0 16px;padding-left:13px;border-left:4px solid var(--gold);letter-spacing:1px}
.md-content h3{font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:18px;color:var(--accent);margin:24px 0 10px;letter-spacing:.5px}
.md-content h4{font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:16px;color:var(--gold);margin:18px 0 8px}
.md-content p{margin:0 0 18px}
.md-content ul,.md-content ol{margin:0 0 20px;padding-left:28px}
.md-content li{margin:9px 0;padding-left:3px}
.md-content li::marker{color:var(--gold)}
.md-content strong{color:var(--accent);font-weight:700;font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif}
.md-content blockquote{margin:16px 0;padding:12px 18px;border-left:3px solid var(--gold);background:#faf6ec;color:#5e5446;font-size:16px;border-radius:0 8px 8px 0}
.md-content code{background:#f0ebe0;padding:2px 6px;border-radius:4px;font-size:15px}
.md-content .wiki{color:var(--person);background:var(--person-soft);padding:2px 6px;border-radius:4px;cursor:pointer;font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:15px;font-weight:600}
.md-content .wiki:hover{background:#d6e2f8}
.md-content .wiki.miss{color:#a89d8e;background:#f0ebe0;cursor:default}
/* 关联节点：亲密性归组 */
.rel-title{font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:15px;color:var(--muted);margin:0 0 14px;font-weight:600;letter-spacing:1.5px}
.rel{display:flex;flex-wrap:wrap;gap:9px}
.chip{font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB","Heiti SC",sans-serif;font-size:14px;padding:7px 15px;border-radius:18px;border:none;background:#f2ede3;cursor:pointer;color:#4a4237;transition:.15s}
.chip:hover{background:var(--gold);color:#fff;transform:translateY(-1px)}
.chip.p{background:var(--person-soft);color:var(--person)} .chip.y{background:var(--yili-soft);color:var(--yili)} .chip.e{background:var(--event-soft);color:var(--event)}
.empty{color:var(--muted);font-size:16px;line-height:2;padding:24px 2px}
.empty .big{font-size:38px;margin-bottom:14px;color:var(--gold)}
.stat{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.8}
.top-list{margin-top:12px}
.top-item{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 0;cursor:pointer;color:#4a4237}
.top-item:hover{color:var(--accent)}
.top-item .bar{height:7px;border-radius:4px;background:var(--gold);opacity:.7}
.rank{width:20px;color:var(--muted);text-align:right}

@media(max-width:900px){.hint{display:none}#search{width:170px}}

/* ===== 手机竖屏：图谱抽屉化，阅读全屏最大化 ===== */
@media(max-width:680px){
  .fab-graph{display:flex}
  #app{position:relative}
  /* 阅读区占满整屏 */
  #panel{width:100%!important;flex:1 1 100%!important;min-width:0}
  /* 图谱展开即全屏最大化，可水平滑入/滑出 */
  #stage{position:absolute;left:0;top:0;bottom:0;z-index:20;width:100vw!important;
    transform:translateX(-104%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
  #app:not(.graph-hidden) #stage{transform:translateX(0)}
  #app:not(.graph-hidden) #panel{border-left-color:transparent}
  /* 全屏图谱下遮罩不再需要 */
  #scrim{display:none!important}
  /* 手机上手柄隐藏，改用按钮/侧滑手势 */
  #resizer{display:none}
  /* 顶部工具栏在抽屉内可横向滚动 */
  #bar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:10px 104px 10px 12px;gap:8px;-webkit-overflow-scrolling:touch}
  #bar::-webkit-scrollbar{display:none}
  #bar .card{flex:none}
  #search{width:150px}
  .legend{display:none}
  .title-badge{font-size:11px}
  /* 阅读排版：手机上正文限宽取消，字号行距适配 */
  #panel .ph{padding:22px 20px 16px}
  #panel .pb{padding:20px 20px 60px}
  .reader{max-width:none}
  #panel h1{font-size:23px;padding-right:96px}
  .show-graph-btn{display:none!important}
  .md-content{font-size:17px;line-height:1.85;letter-spacing:.3px}
  .md-content h2{font-size:20px;margin:28px 0 14px}
  .md-content h3{font-size:18px}
  .sum{font-size:16px;padding:13px 15px}
  .meta-row{gap:24px}
  .rel-title{font-size:14px}
}
/* 悬浮开关：仅阅读态显示（图谱全屏时工具栏已有「隐藏图谱」按钮，悬浮键不再出现） */
@media(min-width:681px){.fab-graph{display:none!important}}
/* 超窄屏微调 */
@media(max-width:380px){
  #search{width:130px}
  #panel h1{font-size:21px}
  .md-content{font-size:16.5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bar">
      <div class="card"><span class="title-badge">保富法</span></div>
      <div class="card"><input id="search" placeholder="搜索人物 / 义理 / 篇章…"></div>
      <div class="card seg">
        <button class="btn on" data-f="all">全部</button>
        <button class="btn" data-f="人物">人物</button>
        <button class="btn" data-f="义理">义理</button>
        <button class="btn" data-f="篇章">篇章</button>
      </div>
      <div class="card legend"><span><span class="dot p"></span>人物</span><span><span class="dot y"></span>义理</span><span><span class="dot e"></span>篇章</span></div>
      <div class="card toggles">
        <button class="btn" id="edgeToggle">隐藏连线</button>
        <button class="btn on" id="labelToggle">全部标签</button>
      </div>
      <div class="card"><button class="btn" id="reset">重置视图</button> <button class="btn" id="clear">清除选择</button></div>
      <div class="card"><button class="btn icon" id="hideGraphBtn" title="收起图谱，沉浸阅读（快捷键 H）">◧ 隐藏图谱</button></div>
      <div class="card hint">拖拽 · 滚轮缩放 · 点击节点看 md 全文 · 悬停高亮关系 · 拖中间竖条滑动图谱</div>
    </div>
    <svg id="svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
  </div>

  <div id="resizer" title="左右拖动调节图谱宽度 · 双击收起/展开"></div>

  <aside id="panel">
    <div class="ph">
      <div class="ph-inner">
        <button class="show-graph-btn" id="showGraphBtn" title="展开图谱（快捷键 H）">▤ 显示图谱</button>
        <h1>保富法知识图谱</h1>
        <div class="sub">聂云台《保富法》· 基于双向链接生成</div>
        <div class="stat" id="stat"></div>
      </div>
    </div>
    <div class="pb" id="pb"></div>
  </aside>
</div>
<div id="scrim"></div>
<button class="fab-graph" id="fabGraph" title="展开 / 收起图谱" aria-label="展开或收起图谱">图谱</button>
<script>
const DATA = {"nodes": [{"id": "乐山公", "type": "人物", "summary": "聂云台七世祖，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>聂云台七世祖，康熙十一年（一六七二）生，祖籍江西，九世祖时迁居湖南衡山。原文下篇专文记述其行医济世的果报。 </p><h2>事迹</h2><p>他学问深、文章好，却不赴考，随祖父学医，开一家小药店；医术精良又乐善好施，医名大著。药店被窃，他抵押住房还债。康熙四十二年（一七零三）衡山大瘟疫，他救活很多人，尤济穷人与受刑犯；常到监狱义诊，说\"救人是我最快乐的事情\"。八十四岁大雪夜，他穿木屐冒雪出诊。 </p><h2>保富启示</h2><p>九十三岁时孙肇奎中乡试第二名，曾孙七人称\"衡山七子\"，泽被子孙超过五代。他留下的不是田产，而是舍己利人的心。不是无钱可供养后代，而是把医术用来活人——这才是能传下去的资本。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"下篇\">下篇</span> — 下篇核心证据。</li><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 义诊赠药，真切布施。</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 可发财而不发，反而发身。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 四代发科第，余庆之证。</li><li><span class=\"wiki\" data-id=\"亦峰公\">亦峰公</span> — 其玄孙，承续家风。</li><li><span class=\"wiki\" data-id=\"先焘公\">先焘公</span> — 其子，承家风。</li><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 七世孙，写下祖德。</li><li><span class=\"wiki\" data-id=\"发心为重\">发心为重</span> — \"救人最快乐\"，发心真切。</li></ul>", "deg": 10}, {"id": "亦峰公", "type": "人物", "summary": "乐山公的玄孙，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>乐山公的玄孙，聂云台的祖父。原文下篇，在记述乐山公善行果报后连带叙及。 </p><h2>事迹</h2><p>他考中咸丰癸丑年翰林，历任广东石城、新会知县，高州府知府及奏奖道员。居官廉洁，尽心民事，对当时发生的械斗巨案宽厚处理，保全了很多生命，民间特别建立生祠纪念他。他又常常捐出所得，在地方上提倡育婴堂、种牛痘、修路、造桥、购义地、埋露棺等善事。死后留下的存款不多，聂云台的父亲早年必须仰赖外出工作的薪资供给家用。 </p><h2>保富启示</h2><p>他从孤苦贫穷中读书出来，四十二岁才入翰林；做官十多年，仍把钱捐出去办事。不是不知道钱有用，而是知道有些事比存钱更要紧。乐山公的德泽到了第五代没有斩，靠的不是祖上留下产业，而是每一代都还有人愿意接着做善事。人肯续，福才续。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 他是乐山公玄孙，五世不斩的关键一环。</li><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 他是聂云台的祖父，清廉家风由此传到作者。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 宽厚断案、捐办善举，余庆及于后人。</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 居官廉洁、散财办善，身后无存款而德被乡里。</li></ul>", "deg": 6}, {"id": "伍秉鉴", "type": "人物", "summary": "广东伍氏，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>广东伍氏，原文上篇。作者与潘氏、孔氏并举，作为与林则徐对照的反面案例。 </p><h2>事迹</h2><p>伍、潘、孔三家都在鸦片里发了大财，达数百千万银两。书画家都知道，海内有名的古字画碑帖多数盖有三家的图章，表明曾为三家收藏，可见豪富。几十年后，这些珍贵物品已流到别家；楠木房屋被拆，到别家作妆饰、木器；三家的后人，一个闻达的也没有。作者说三家主人总算精明能干，会发这样的大财；当时林文忠公有财却不肯发，还落到革职办罪，看似太笨。 </p><h2>保富启示</h2><p>数十年后再看，作者说林文忠公才是世间最有智慧的人，三家却最愚笨。这不是聪明与否的颠倒，而是算账的期限不同：一算眼前，一算几代。图章盖得住字画，盖不住家运；藏得下珍品，藏不住后人。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 鸦片致富、收藏自炫，钱都用来堆自家场面。</li><li><span class=\"wiki\" data-id=\"林则徐\">林则徐</span> — 同一时势，一个不取，一个聚财数千万，结果相反。</li><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 此对照见《保富法》上篇林文忠公一段之后。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 后人无一个闻达，是不义之财的余殃。</li></ul>", "deg": 4}, {"id": "先焘公", "type": "人物", "summary": "乐山公之子，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>乐山公之子，聂云台的太高祖一支。原文下篇《七世祖乐山公行医济世善行的果报》中叙其读书入仕与赴任经过。 </p><h2>事迹</h2><p>县长葛公感念乐山公存心救人，说没法报答，愿教其子读书成名，乐山公便送他进入雯峰与集贤两书院；他不久中举人，又中进士。六十七岁时父亲送他进京会试，途中遇严冬瘟疫，父亲治病救人，他则赶赴前程。后来他被派任陕西镇安县县长，乐山公陪他上任，指示山地民众就地采药增加收入。回湘后，乐山公寄信教他爱民治世之道，信被陕西巡抚陈文恭见到，大加称赞，刊印发送全省官府参考，后来又刊入《皇朝经世文编》。 </p><h2>保富启示</h2><p>这不是靠父辈留下钱财起家，而是靠父辈留下教诲立身。一封信能被巡抚刊行全省，说明真正值钱的是爱民的心法。父亲留下的不是遗产，是判断是非的标准。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 他是乐山公之子，医者的济世之心由他转为治世之政。</li><li><span class=\"wiki\" data-id=\"亦峰公\">亦峰公</span> — 乐山公玄孙，承续同一脉的家风。</li><li><span class=\"wiki\" data-id=\"下篇\">下篇</span> — 其读书与任职事迹均见《保富法》下篇。</li></ul>", "deg": 3}, {"id": "周翁", "type": "人物", "summary": "江西盐商，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>江西盐商，原文上篇。作者五十年前在扬州岳家萧家认识他，当时两家同为盐商领袖。 </p><h2>事迹</h2><p>有一次他到萧家，怒气勃勃：湘潭分号经理来信说湖南灾荒、官府劝募，经理代他认捐了五百两，他嫌捐得太多。那时他已有数百万两财富，五百两仍不舍得。后来谭组安与他同席，问他如何发到如此大富，他答：\"没有别的法子，止是积而不用。\"他活到八十多岁才死，遗产三千万，十房子孙分家不过十几年就空了；只有略能作些好事的一房稍好。 </p><h2>保富启示</h2><p>作者说他是正当营业，并未取非分之财；毛病只在心里悭贪，眼见饥荒不肯出钱。这不是取财不正当的报应，而是聚而不散的自然结局。以为积钱不用是聪明，其实是把钱与福一起锁死；十房分家十几年败尽，正是余殃落在子孙身上。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 五百两嫌多，是悭贪心最直白的写照。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 作者用他说明正当营业也须懂保富之道。</li><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 这则实例见《保富法》上篇周翁一段。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 子孙十余年败光，正合积不善之家必有余殃。</li></ul>", "deg": 4}, {"id": "哈同", "type": "人物", "summary": "上海哈同花园主人，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>上海哈同花园主人，原文上篇。作者引当时报纸讥讽之词，说他生平对慈善事业不肯多多帮助。 </p><h2>事迹</h2><p>报纸说他有遗产八万万银元。作者算了一笔账：照二厘利息，每年应有一千六百万，若肯把尾数的六百万元拿来救济贫民，全上海难民就得救了；难民所十万人每人每月两元，全年不过两百余万元。上海马路上死去的穷人，去年将近两万多。他挂着信佛的招牌，却不知《药师经》所说的悭贪不舍之罪：\"见乞者来，其心不喜\"。他既无子女，财产全归他人。 </p><h2>保富启示</h2><p>他以为守住的是钱，其实守的是一身的罪业和一片不美的口碑。不是没有能力救人，而是不肯拔那一毛；不是钱留住了，而是福先走了。积财不施的人，钱财再多也只是一时的寄放。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 作者引《药师经》明悭贪不舍之罪，正指此人。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 无子女、财产归他人，是不留德的结局。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 作为反面教材，说明有钱不等于能保富。</li><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 这段落载于《保富法》上篇，紧接陈某之后。</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 不义之财与不施之心，自有其果报。</li></ul>", "deg": 5}, {"id": "巨公", "type": "人物", "summary": "序三引太仓陆毅氏所述的一位官员，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>序三引太仓陆毅氏所述的一位官员，姓名不传。丁福保借他作为\"巧于取财者之戒\"。 </p><h2>事迹</h2><p>他登第数年即开府，入为卿贰，才略经济卓然有闻于时，儿子也继起同列清华，为世俗艳羡。他在朝时每年派人走四方索币赋，言词甚哀，借在山之势故作乞怜之状，务必取到；得之而人莫怨，享之也安。作者说，为善不令人知是阴德，食报必丰；此人取财也使人不知其为恶，其事与种德者相反，其意同出于阴，故报亦酷。不久两孙夭折、一子随之、巨公亦殁，半载之间三代沦亡，斩焉绝后。 </p><h2>保富启示</h2><p>他不是明抢，而是让人不好意思拒绝。不是不懂分寸，而是把分寸用错了地方：用的是巧，不是德。取财时越让人不觉得是恶，果报越酷。丁福保说，若能依本书之法既积而复散，必可化奇祸为钜福。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 巧取四方币赋而不散，是悭贪的官场形态。</li><li><span class=\"wiki\" data-id=\"阴德\">阴德</span> — 他取财不使人知，其事恰与阴德相反。</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 半年三代沦亡，是序三所举的现世果报。</li><li><span class=\"wiki\" data-id=\"序三\">序三</span> — 此故事由丁福保在序中引述，用以劝世。</li></ul>", "deg": 4}, {"id": "曾国藩", "type": "人物", "summary": "清朝中兴名臣，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>清朝中兴名臣，谥文正，聂云台的外祖父。见于原文上篇、下篇、附录二，是书中\"不肯发财\"一路最显明的代表。 </p><h2>事迹</h2><p>他地位最高、权力最重，在位二十年，死时只有两万两银子；除乡间老屋，未在省中建房，也未买一亩田。他创立两淮盐票，每张二百两，后卖到二万两，年息三四千两，却谕令家人不准承领——借政权取巧，君子不为。他曾宣誓\"不取军中的一钱，寄回家里\"，数十年如一日。居所题作\"求阙斋\"，常说\"花未全开月未圆\"；家规嫁娶花费限二百金以内。 </p><h2>保富启示</h2><p>他留下的不是钱，而是不取巧的分寸。不是故意让子孙清苦，而是明白物质留一点欠缺，精神才有圆满余地。曾孙辈大学毕业六七位、任大学教授三位。持满戒溢不是消极，是看懂盛极必衰后不把福享尽。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 不聚财的正面注脚。</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 不取一钱。</li><li><span class=\"wiki\" data-id=\"持盈保泰\">持盈保泰</span> — 求阙斋戒溢。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 曾孙贤能。</li><li><span class=\"wiki\" data-id=\"谦德\">谦德</span> — 有权不用，是谓谦。</li><li><span class=\"wiki\" data-id=\"下篇\">下篇</span> — 家规见于下篇。</li><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 其外孙。</li><li><span class=\"wiki\" data-id=\"五世而斩\">五世而斩</span> — 德泽胜财产。</li></ul>", "deg": 10}, {"id": "杨绾", "type": "人物", "summary": "唐朝大历年间宰相，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>唐朝大历年间宰相，原文书后。作者抄录顾亭林所引史实，以他说明俭德可以化人。 </p><h2>事迹</h2><p>杨绾为官一向廉明方正，生活非常俭朴。皇帝下诏拜他作宰相的消息传出，御史中丞崔宽家中花园的楼台亭榭既多且美，当时称为天下第一，却在当天立刻默默自行撤毁。郭子仪听到消息，也把自家乐伎裁减五分之四。作者感叹：可惜今天再也看不到杨绾，也没有崔宽与郭子仪这类人物了。 </p><h2>保富启示</h2><p>他没有下令禁奢，别人却自己收敛。这不是权势压人，而是德行让人自惭。一个人守得住俭，周围人就不敢把富摆出来；风气转变往往从一个人身上开始。所谓\"惟俭可以养廉\"，俭不是省钱的小事，是守住了不贪的第一道关口。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"俭以养廉\">俭以养廉</span> — 他的俭朴使豪富者自毁楼台，是俭德化人的明证。</li><li><span class=\"wiki\" data-id=\"书后\">书后</span> — 他的故事由作者抄自顾亭林文中，用来论奢靡与政治。</li><li><span class=\"wiki\" data-id=\"郭子仪\">郭子仪</span> — 功高封王，闻其拜相而裁减乐伎五分之四。</li></ul>", "deg": 3}, {"id": "林则徐", "type": "人物", "summary": "清朝林文忠公，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>清朝林文忠公，原文上篇。作者称他是反对英国、引起鸦片战争的伟人。 </p><h2>事迹</h2><p>他认为鸦片贻害人民非常严重，不怕用激烈的手段，烧毁鸦片两万箱。作者说，他若想发财，当时发个几百万很容易，他却没有。英国人攻广东，一年攻不进，以后攻陷宁波、镇江；清朝不得已将他革职充军，向英国人谢罪谈和。林公死后毫无积蓄，子孙数代书香不断，孙曾辈中尚有进士、举人；数年前故世的最高法院院长林翔也是其后人，道德亦非常崇高。 </p><h2>保富启示</h2><p>与同时发大财的广东伍氏、潘氏、孔氏相比，当时看他是笨的：有财不取，还把自己弄到革职办罪。几十年后再看，作者说他才是世间最有智慧的人。这不是清高，而是知道什么是不能换的。烧掉两万箱鸦片，损失的是一己的禄位；保住的是万千人的性命，也保住了后代读书做人的根。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 有财不取，不以身发财。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 毫无积蓄，却有数代书香与贤能后人。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 与伍潘孔三家对照，说明保富不在聚钱。</li><li><span class=\"wiki\" data-id=\"伍秉鉴\">伍秉鉴</span> — 同一场鸦片生意，一个不取，一个发了数千万两。</li></ul>", "deg": 5}, {"id": "耶律楚材", "type": "人物", "summary": "元朝耶律文正公，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>元朝耶律文正公，原文上篇。作者说他是元太祖成吉思汗及元世祖的军师，军事多数由他决策。 </p><h2>事迹</h2><p>元太祖好杀，他善于说话，能劝谏太祖不要屠杀，借此救全了无数人民。攻破燕京时，诸位将领都到府库里收取财宝，他却只吩咐将库存的大黄数十担送到营中；不久发生瘟疫，他用大黄治疗疫病，获得很大效果。身为宰相，他布衣蔬食，生活非常刻苦；他是大佛学家，利欲心极为淡泊，毫无积蓄。 </p><h2>保富启示</h2><p>他不是没有机会聚财，而是不在财上着力。诸将抢的是眼前的金玉，他取的是日后能救人的药；同一场攻城，两种眼光，分出了两种去向。他毫不积钱，子孙数代作宰相的却有十三人之多。这不是运气，而是\"积善之家，必有余庆\"落在一家人的身上。保全别人的人，最终也保住了自己的后路。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 独取大黄，财物用于救人。</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 布衣蔬食、毫无积蓄，却换来子孙十三人作宰相。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 劝谏止屠杀、用大黄治疫，余庆落在数代子孙。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 作者以他证明不肯积钱的人，子孙反而大发达。</li></ul>", "deg": 5}, {"id": "聂云台", "type": "人物", "summary": "《保富法》作者，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>《保富法》作者，曾国藩外孙，母为曾文正公的幺女。祖籍江西，九世祖时迁居湖南衡山。全书及附录一、书后皆出其手。 </p><h2>事迹</h2><p>一九四二年卧病写成上、中两篇，经《申报》刊出后，数日间收到助学献金四十余万银元；一九四三年续写下篇，专述七世祖乐山公行医济世的果报作为印证；一九四七年再作书后，论奢靡之风对政治的不良影响。他自述母亲出嫁时奁金三千尚被移拨家用、代赔钱号倒款，离家东行时祖母只给路费六百两。他又坦言生平过失愧对祖宗父母，故撰述祖德告后人。 </p><h2>保富启示</h2><p>他写这本书，不是教人怎么多赚钱，而是教人怎么留住福。不是站在高处说理，而是拿自家几代清贫与兴旺作凭证。钱来去都不觉，计谋多是白费；能传下去的，是发心与德行。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 全书出自他的手笔。</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 七世祖，下篇的核心印证。</li><li><span class=\"wiki\" data-id=\"亦峰公\">亦峰公</span> — 祖父，清廉家风由此而来。</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 外祖父，不取巧的典范。</li><li><span class=\"wiki\" data-id=\"下篇\">下篇</span> — 他卧病写成，自述撰述缘起。</li><li><span class=\"wiki\" data-id=\"书后\">书后</span> — 论俭与政治。</li><li><span class=\"wiki\" data-id=\"附录一\">附录一</span> — 卧病随笔，重在发心。</li></ul>", "deg": 8}, {"id": "范仲淹", "type": "人物", "summary": "宋朝范文正公，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>宋朝范文正公，原文上篇第一个正面案例。他作穷秀才时，心中就念念在救济众人。 </p><h2>事迹</h2><p>后来作了宰相，把俸禄全部拿出来购置义田，赡养一族的贫寒。他先买苏州南园作住宅，听见风水家说\"此屋风水极好，后代会出公卿\"，便立刻捐为学宫，让苏州子弟共受教。儿子请他在京中买一所花园宅第养老，他答：\"京中各大官家中的园林甚多，而园主人自己又不能时常的游园，那么谁还会不准我游呢！\"出将入相几十年，俸钱都作了布施救济，家用极为节俭，死时连丧葬费都不够。 </p><h2>保富启示</h2><p>他不是不替子孙打算，而是换了一种打算。一间宅子的福分分给一城人，四个儿子却都作了宰相公卿侍郎，且道德崇高；八百年后苏州范坟一带仍有后人，还时常出优秀分子。这不是亏本，而是以财发身。钱财只圈在自家院子里，圈小的其实是子孙的眼界。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 俸钱尽布施。</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 不留私产而德誉长存。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 八百年不衰的证据。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 保富主张的最佳注脚。</li><li><span class=\"wiki\" data-id=\"智慧眼光\">智慧眼光</span> — 捐宅为学宫，见多数人兴发。</li></ul>", "deg": 6}, {"id": "诸葛亮", "type": "人物", "summary": "三国诸葛武侯，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>三国诸葛武侯，原文附录二。作者引他的话，作为心理存养、寡欲养心的典范。 </p><h2>事迹</h2><p>诸葛武侯说：\"非淡泊，无以明志；非宁静，无以致远。\"作者解释：淡泊是说欲望少，一切欲望都能使人心志昏昧，低级欲望更为严重；宁静是指心思的安定，心若系于情欲，就没有宁静可言。他又引孟子\"其为人也寡欲，虽有不存焉者，寡矣\"来印证，并归结为一句话：嗜欲深则天机浅，物欲少则心智明。 </p><h2>保富启示</h2><p>这不是叫人清贫到底，而是保护那点清明。心被欲牵着走，眼前只见好处，看不到第二著、第三著；看得不远，钱便留不住。作者把勤苦锻炼与淡泊存养并举：身体要经得起劳，心思要守得住静。两者都在，意志才有根。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"勤苦修身\">勤苦修身</span> — 淡泊宁静是心理存养一路，与习劳锻炼互补。</li><li><span class=\"wiki\" data-id=\"附录二\">附录二</span> — 此语引自作者一九四六年旧作，属附录二内容。</li><li><span class=\"wiki\" data-id=\"陶侃\">陶侃</span> — 陶侃运甓磨身，诸葛亮寡欲养心，同为修养原则。</li></ul>", "deg": 3}, {"id": "郭子仪", "type": "人物", "summary": "唐朝名将，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>唐朝名将，原文书后。作者引顾亭林所抄史实，将他列为敬畏俭德的例子。 </p><h2>事迹</h2><p>郭子仪军功甚大，曾立下收复两个京师的大功，封为汾阳王，威势权力可称震惊当世。唐大历年间，廉明方正、生活俭朴的杨绾拜相，他听到消息，便主动把家中乐伎裁减了五分之四。作者特意点出：以他这样的功业和地位，对一位崇尚廉洁俭朴的宰相，仍是如此敬畏。 </p><h2>保富启示</h2><p>他不是被谁弹劾，也不是家中缺钱，而是自己把排场收了回去。这不是怕人，而是明白分寸：居高位而炫耀，最容易招嫉；见俭德而自敛，反能长久。权力能买到许多东西，买不到别人心里的敬重；那份敬重，要靠自己守得住的俭与让来换。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"俭以养廉\">俭以养廉</span> — 主动减乐伎，是对俭德的敬畏与自我约束。</li><li><span class=\"wiki\" data-id=\"杨绾\">杨绾</span> — 因他拜相而自敛，两人构成俭德感化的典型。</li><li><span class=\"wiki\" data-id=\"书后\">书后</span> — 此例出自书后所抄顾亭林论奢靡的史实。</li></ul>", "deg": 3}, {"id": "陈某", "type": "人物", "summary": "上海十几年前的地皮大王，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>上海十几年前的地皮大王，原文上篇。作者一九二五年曾到他家吃饭，记下所见所闻。 </p><h2>事迹</h2><p>他家中财产四千万银元，兄弟两房各分两千万。住所十分华贵，门前一对石狮子为上海少见；客房四壁全装玻璃架，陈列三千年的古铜器。有客人告诉作者：\"这一间房子里的铜器，要值银元一百五十万；中国的有名古铜器，有一半在此。\"这几句话正是主人最爱听的。作者说，富人无可奈何，只好在衣服、珍宝、房屋、器具上争豪斗胜。见面后不过七年，上海地价惨落，加以投机损失，他破产了；古铜珍宝、房屋地产全被银行没收变卖，主人搬回内地家乡。 </p><h2>保富启示</h2><p>他夸耀的是器物，漏算的是时势。不是财富不多，而是眼光只见眼前一室，不见七年之后。骄与奢相连，摆架子的尽头常是闹阔的空。真正的保富，靠的是能看远一著的见识。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 家财只用于夸耀，不肯救人。</li><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 此例见《保富法》上篇上海阔老数则之中。</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 财产被没收变卖，余殃来得比想象中快。</li><li><span class=\"wiki\" data-id=\"智慧眼光\">智慧眼光</span> — 见铜器之贵，不见地价之落。</li></ul>", "deg": 4}, {"id": "陶侃", "type": "人物", "summary": "晋朝人，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>晋朝人，原文附录二。作者列举古今勤苦奋斗的名人时，以他作为生理锻炼、砥砺意志的例证。 </p><h2>事迹</h2><p>陶侃早晨把一百片瓦搬到屋外，黄昏又搬回屋内。他自述：\"我正致力于收复中原的大事，若是平时生活太过优闲，到时候恐怕不能胜任大事，所以自己必须要求自己吃苦耐劳呀！\"搬运瓦片并不是为了搬瓦，而是为了不让自己在安逸中松掉。作者说，自古以来名人学问事业的成就，都从勤苦奋斗中来，意志力必须经由砥砺磨练才会更加坚强。 </p><h2>保富启示</h2><p>他不是没有正事可做，而是把日常小事当作磨刀石。不是吃苦本身有价值，而是人若久不吃苦，遇上大事就担不起来。财富也一样：未经磨砺的人，守不住忽然而来的钱；能担事的人，才谈得上保富。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"勤苦修身\">勤苦修身</span> — 运甓是\"习劳则神钦\"最具体的注脚。</li><li><span class=\"wiki\" data-id=\"附录二\">附录二</span> — 此例出自作者一九四六年旧作《色情刊物与跳舞》。</li><li><span class=\"wiki\" data-id=\"诸葛亮\">诸葛亮</span> — 他主勤苦锻炼，诸葛亮主淡泊存养，合为身心两途。</li></ul>", "deg": 3}, {"id": "顾亭林", "type": "人物", "summary": "明朝大学问家顾炎武，", "content": "<p>tags: [人物] </p><h2>身份 / 出处</h2><p>明朝大学问家顾炎武，号亭林先生。原文书后开篇，作者说他早已见到奢靡之风对政治的不良影响，并作有专文、引证许多历史事实。 </p><h2>事迹</h2><p>《保富法》书后抄录的正是这些史实：袁绍过郡界屏去车马随从，只驾一车；刘整见蔡充后自觉庸俗不安；崔谌吊李德林，沿途减随从至五人；袁叔德访李僧伽，也为华丽车服而羞。顾亭林更明白指出：\"天下安危，匹夫之贱，与有责任。\"作者据此主张：国家社会风气若奢靡，为政的人应以崇尚俭朴来转移风气。 </p><h2>保富启示</h2><p>他看的不是一个人的开销，而是风气如何渗进政治。这不是把奢靡当作私德小事，而是视作乱源。人人行事都能影响国家，所以节俭不只是自家账本上的事。把欲望收一收，政治才有清明的可能。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"书后\">书后</span> — 作者抄录其专文史实，作为书后的主体内容。</li><li><span class=\"wiki\" data-id=\"俭以养廉\">俭以养廉</span> — 他论奢靡伤政，正合\"惟俭可以养廉\"之旨。</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 由个人保富推及社会风气，是他被引入的原因。</li></ul>", "deg": 3}, {"id": "下有千算天止一算", "type": "义理", "summary": "中篇说，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇说，这叫作‘人有千算，天止一算。’又引‘人定胜天，天定亦胜人’。 </p><h2>含义</h2><p>天道不许巧取者真赢。借地位谋私、见灾不救，众人无可奈何，法律也办不到他，他算是棋赢了；老天轻轻动一著，就令满盘皆输。对人赢得愈大，对天输得愈厉害。不是天偏心，而是千算抵不过一算的天理。原文说，天公下棋不动心也不动手，人们就自然输了。 </p><h2>印证</h2><p>人肯让松些，还处处帮旁人一著，使旁人免输，自己对天反赢一大盘。范仲淹到死没有私人田产园宅，俗人看他白忙一世，原文却说他赢了天公一盘大棋；善人对天赢了棋，实际上就是天赢了。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 此语出自中篇</li><li><span class=\"wiki\" data-id=\"下棋喻\">下棋喻</span> — 千算一算的具体比喻</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 输赢即是果报</li><li><span class=\"wiki\" data-id=\"反者道之动\">反者道之动</span> — 让一著反而赢</li></ul>", "deg": 5}, {"id": "下棋喻", "type": "义理", "summary": "中篇以棋作喻：‘世间事都是下棋’，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇以棋作喻：‘世间事都是下棋’，我若是动一著，对方就要应我一著，而且马上就有第二三著跟着来。 </p><h2>含义</h2><p>说一句话、作一件事，是对人动了一著棋；出言作事时心中打定的主意，是对天公动了一著棋。一切人、一切物，都是我们的对手。不是一步棋孤立地落下，而是步步都有回应，不是只看自己这一步，还要想到对方与旁人的下一步，浅见的人只看得一著。 </p><h2>印证</h2><p>对一只狗表示好意，狗就摇尾亲热；恶声相向，它就拖尾走开。待人谦和宽厚则感谢，骄傲刻薄则怀恨。欺凌无力者、占人便宜，众人无可奈何，天道便替众人作他的大对手。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"下有千算天止一算\">下有千算天止一算</span> — 对手是天时的输赢</li><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 此喻出自中篇</li><li><span class=\"wiki\" data-id=\"智慧眼光\">智慧眼光</span> — 多看第二三著</li></ul>", "deg": 4}, {"id": "五世而斩", "type": "义理", "summary": "下篇引孟子‘君子之泽，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>下篇引孟子‘君子之泽，五世而斩’，又引俗话‘世无三代富’、‘天下无不散的筵席’。 </p><h2>含义</h2><p>富贵难久，是常情；德泽的久暂，不在钱多钱少，而在德是否接续。不是留给子孙一笔财，而是留下能继续行善的门风。原文说巧取豪夺的财富败落更快，唯有孝悌忠厚、修德积善的家庭，才能确实保有家业，可大可久。原文说，世间并无坚固不坏的东西，也无永久可靠的事业；富不过三代，正是常情。 </p><h2>印证</h2><p>乐山公子、孙、曾、玄四代发科第，第五代亦峰公仍行善积德，聂云台为第七代尚承余荫，泽被超过五代，是书中举出的例外。阮文达贺乐山公夫人寿联说‘七旬介寿，七子成名’，记其一时之盛。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 德泽越过五代</li><li><span class=\"wiki\" data-id=\"持盈保泰\">持盈保泰</span> — 不使太盛之道</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 泽被七代的实证</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 全书要回答的难题</li></ul>", "deg": 6}, {"id": "以财发身", "type": "义理", "summary": "《大学》说‘仁者以财发身，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>《大学》说‘仁者以财发身，不仁者以身发财’，《孟子》说‘为富不仁，为仁不富’；下篇以乐山公之事再作印证。 </p><h2>含义</h2><p>以财发身，是用财修德造福，身安而泽及后人；以身发财，是以身命换钱财，财聚而祸随。原文说贪财与不贪财，关系别人的利益幸福很大：发财便能造罪，不贪财方能造福。不是不要财，而是不让财反过来支配人。 </p><h2>印证</h2><p>乐山公开药店本可发财，却对贫病者义诊赠药，一生清贫，德誉盛于当时，子孙五六代发科第。范仲淹以俸禄置义田，曾国藩严限家费，走的是同一条路。原文说，虽数代清贫，却换得后代子孙发达。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 全书主张的方向</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 以清贫发身</li><li><span class=\"wiki\" data-id=\"范仲淹\">范仲淹</span> — 以俸禄发身</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 医师清贫而发身</li><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 财该往何处去</li></ul>", "deg": 9}, {"id": "保富法", "type": "义理", "summary": "上篇开篇说‘发财不难，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>上篇开篇说‘发财不难，保财最难’。全书上、中、下三篇，从人事观察、天道法则到祖德实证，讲的都是这一件事。 </p><h2>含义</h2><p>保富法不是一套聚财术，而是守住财富的心法。老子说‘既以为人，己愈有；既已与人，己愈多’，意思是越把财用于人，自己反而越有。它靠的不是精算，而是智慧眼光：辽远的见识与宏大的心量。看得见年底除夕，才不会只守着初一。 </p><h2>印证</h2><p>曾国藩不取军中一钱，范仲淹以俸禄置义田，乐山公行医清贫而泽被后代，是为正面；哈同遗产八万万却不肯救济贫民，是为反面。保富不是保住一堆银钱，而是保住福与德。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 总纲与败落实例</li><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 天道法则</li><li><span class=\"wiki\" data-id=\"下篇\">下篇</span> — 以乐山公祖德作实证</li><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 保富所依的天道</li><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 留德胜过留钱</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 用财修德的方向</li><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 保富与悭贪的分界</li><li><span class=\"wiki\" data-id=\"智慧眼光\">智慧眼光</span> — 保富第一要紧处</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 清廉持满的样本</li><li><span class=\"wiki\" data-id=\"范仲淹\">范仲淹</span> — 以财济众的样本</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 祖德庇佑后代</li><li><span class=\"wiki\" data-id=\"哈同\">哈同</span> — 积财不施的反面</li></ul>", "deg": 23}, {"id": "俭以养廉", "type": "义理", "summary": "书后引古语‘惟俭可以养廉’，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>书后引古语‘惟俭可以养廉’，并抄录顾亭林论奢靡之风对政治的不良影响。 </p><h2>含义</h2><p>俭不是吝啬，是把欲望收住，好让廉站得住。奢侈则不能不贪污，贪污的结果是社会天下大乱。《大学》说‘生财有大道，生之者众，食之者寡，为之者疾，用之者舒，则财恒足矣’，讲的是同一层道理。 </p><h2>印证</h2><p>唐代杨绾拜相，富甲天下的崔宽当日自行拆毁花园楼台，郭子仪也把家中乐伎裁减五分之四。顾亭林说‘天下安危，匹夫之贱，与有责任’，一个人的行事也能转移风气。原文举袁绍、崔谌诸例：奢者遇见俭朴之士，往往自惭而减撤车从。书后说，崇尚清廉俭朴与政治的互动关系实在非常密切。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"书后\">书后</span> — 此义出自书后</li><li><span class=\"wiki\" data-id=\"顾亭林\">顾亭林</span> — 论奢靡影响政治</li><li><span class=\"wiki\" data-id=\"杨绾\">杨绾</span> — 俭德化人的例证</li><li><span class=\"wiki\" data-id=\"附录二\">附录二</span> — 论嗜欲使人失清明</li></ul>", "deg": 5}, {"id": "勤苦修身", "type": "义理", "summary": "附录二引曾国藩‘精神愈用而愈出，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>附录二引曾国藩‘精神愈用而愈出，智慧愈苦而愈明’，又说‘主敬则身强，习劳则神钦’；并引诸葛亮‘非淡泊，无以明志；非宁静，无以致远’。 </p><h2>含义</h2><p>身心效能确能增进：生理方面要加以锻炼，心理方面要加以存养。不是靠娱乐培养精神，而是靠砥砺磨炼使意志坚强。嗜欲深则天机浅，物欲少则心智明；心系情欲，就没有宁静。原文说，意志力必须经由砥砺磨练，才会更加坚强。 </p><h2>印证</h2><p>陶侃早晨搬一百片瓦到屋外、黄昏再搬回，说平日不可过闲，以免难当大事；董仲舒下帷三年，眼睛不向花园看；勾践卧薪尝胆。曾国藩黎明与幕僚共餐，夜二鼓后就寝，公文亲笔，读书仍有常课。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"陶侃\">陶侃</span> — 运甓习劳的例证</li><li><span class=\"wiki\" data-id=\"诸葛亮\">诸葛亮</span> — 淡泊宁静的例证</li><li><span class=\"wiki\" data-id=\"附录二\">附录二</span> — 此义出自附录二</li></ul>", "deg": 3}, {"id": "反者道之动", "type": "义理", "summary": "上篇引老子《道德经》‘反者，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>上篇引老子《道德经》‘反者，道之动’，又引‘知其雄，守其雌，为天下溪。知其白，守其黑，为天下式’。 </p><h2>含义</h2><p>反不是唱反调，而是翻然觉悟、倒过来做：有钱有势，不炫赫气焰，向平淡卑下处走；做大官享大名，不享尽体面荣华，宁可韬光养晦、退让谦虚。违背情欲以求合乎理智，与世俗之见相反，所以多数人不爱听。 </p><h2>印证</h2><p>‘既以为人，己愈有；既已与人，己愈多’，正是保富法的注脚。《中庸》说‘衣锦尚絅，恶其文之著也’，穿锦衣再加罩衫，是君子实修善义、不务虚名，反而更为社会所敬重。原文说，这些见解都与世俗之见相反，多数人听着不入耳。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"谦德\">谦德</span> — 反过来做的落点</li><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 反者之道与天道相应</li><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 舍正是得</li><li><span class=\"wiki\" data-id=\"下棋喻\">下棋喻</span> — 反向落子另有回应</li></ul>", "deg": 5}, {"id": "发心为重", "type": "义理", "summary": "附录一卧病随笔说：‘一切的善事，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>附录一卧病随笔说：‘一切的善事，重点在于发心，而金额的多少，还在其次。’ </p><h2>含义</h2><p>发心真切而力量不及，钱少而功德极大；缺乏真实慈愍心，钱多而功德很小。不是拿数目论高低，而是看那一念是否为利人济物。原文劝人多培养慈悲心，常以利人济物为做人处世的目标。原文又说，子女智愚贤不肖，教育的影响也实在有限。 </p><h2>印证</h2><p>乐山公药店被窃，抵房还债，八十四岁雪夜穿木屐出诊，钱不多而存心真切；哈同有八万万遗产，却连利息尾数也不肯用于救难。附录一说，财富之来去都不觉得，用尽计谋也是白费心机；如此为子女培福，子孙可享幸福。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"财布施与悭贪\">财布施与悭贪</span> — 发心决定布施的分量</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 心真而力薄的例证</li><li><span class=\"wiki\" data-id=\"附录一\">附录一</span> — 此义出自附录一</li></ul>", "deg": 3}, {"id": "因果报应", "type": "义理", "summary": "序一说‘命由我作，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>序一说‘命由我作，福自己求’，一切自业自得；序三详述因果轮回；中篇归结为‘自造因，自结果’。 </p><h2>含义</h2><p>因果不是天上临时记账，而是自造因、自结果。它贯通三世，复杂万分；个人果报之外还有共同业报，形成业力网，需要同舟共济，绝难独善其身。深信因果、行善积德，是改造命运的路，不是说一句道理就能免报。原文又说，不怨天、不尤人，一切都是自业自得，怨天无用。 </p><h2>印证</h2><p>序一指出《保富法》以集体范例、《了凡四训》以个人资料，互补印证因果；序三所记巨公巧于取财，半年中三代沦亡，为巧取者之戒。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 因果及于子孙</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 全书立在因果上</li><li><span class=\"wiki\" data-id=\"序一\">序一</span> — 论命由我作</li><li><span class=\"wiki\" data-id=\"巨公\">巨公</span> — 巧取财的现世警策</li><li><span class=\"wiki\" data-id=\"下有千算天止一算\">下有千算天止一算</span> — 因果在下棋中呈现</li></ul>", "deg": 12}, {"id": "天道亏盈益谦", "type": "义理", "summary": "中篇引《易经》‘一阴一阳之谓道’，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇引《易经》‘一阴一阳之谓道’，又说‘天道亏盈而益谦，地道变盈而流谦，鬼神祸盈而福谦，人道恶盈而好谦’；《尚书》说‘满招损，谦受益，时乃天道’。 </p><h2>含义</h2><p>阴阳不是虚玄：有日必有夜，有潮涨就有潮落。人事盛衰也一样，过了界限就起变化，阳极阴生，盛极必衰。天道很简单：过分的受制裁，吃亏的受补益。不是天有意奖惩，而是失衡终会回到平均。 </p><h2>印证</h2><p>喜欢骄傲的，一定会有倒架子的时候；喜欢悭吝贪钱的，会有嫖赌浪费的子孙替他败。圣哲教人常立在吃亏的地位，谦卑退让、舍财不贪。开始似乎吃亏，后来仍得大便宜。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 天道法则出自此篇</li><li><span class=\"wiki\" data-id=\"谦德\">谦德</span> — 益谦落实在人心</li><li><span class=\"wiki\" data-id=\"致中和\">致中和</span> — 阴阳平均即中和</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 保富所依的天道</li><li><span class=\"wiki\" data-id=\"下有千算天止一算\">下有千算天止一算</span> — 天道不许巧取者赢</li></ul>", "deg": 7}, {"id": "持盈保泰", "type": "义理", "summary": "下篇记曾国藩名其居曰‘求阙斋’，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>下篇记曾国藩名其居曰‘求阙斋’，用意是‘持满戒溢，要居安思危’，并常举‘花未全开月未圆’的话。 </p><h2>含义</h2><p>世间并无十全十美，‘丰于此者，必缺于彼’。想求精神圆满，最好先在物质上常留些欠缺。不是消极退让，而是不把福享尽。原文说家计不宜宽裕，与常人见解恰恰相反；花全开就快凋谢，月已圆转瞬就缺。 </p><h2>印证</h2><p>曾家嫁娶花费限二百金以内；曾国藩死时只有两万两银，省中未建房、未买田。下篇说个人享受不可丰厚，要常想街头三餐不继的穷人，节省享受去救死恤孤。原文说，一念仁慈能使天地间产生祥和之气，家庭子孙都受福荫。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 求阙斋的主人</li><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 持盈所依的天道</li><li><span class=\"wiki\" data-id=\"五世而斩\">五世而斩</span> — 德泽比财富长久</li><li><span class=\"wiki\" data-id=\"皮球喻\">皮球喻</span> — 满则必返的回力</li></ul>", "deg": 4}, {"id": "智慧眼光", "type": "义理", "summary": "上篇结尾说：‘保富的方法，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>上篇结尾说：‘保富的方法，必须要有智慧的眼光，也就是要有辽远的见识、与宏大的心量’。 </p><h2>含义</h2><p>智慧眼光不是算得精，而是看得远、想得宽。原文说不会保富的人，只见一点遗漏万端，只看表面看不到内涵；看历本只看见初一，还不知明天有初二，更不晓得年底有除夕。一经点拨即可觉悟，智慧的眼光忽然开朗。 </p><h2>印证</h2><p>陈某以一室三千年的古铜器自夸，七年后地价惨落，古铜房产尽被银行没收；哈同只想一千六百万年息一滴不漏。原文说，他们不能使子孙长保富厚，只因自己的智慧不够。范仲淹、曾国藩肯舍眼前小利，才是有眼光的人。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 保富第一要紧处</li><li><span class=\"wiki\" data-id=\"上篇\">上篇</span> — 此义出自上篇</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 有远见的正面例</li><li><span class=\"wiki\" data-id=\"陈某\">陈某</span> — 只见眼前的反面例</li></ul>", "deg": 6}, {"id": "皮球喻", "type": "义理", "summary": "中篇说：‘譬如对墙壁抛皮球，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇说：‘譬如对墙壁抛皮球，球自然会回抛过来，抛的力量越大，球回的力量也更大，而墙壁本身，亦并未动手费力。’ </p><h2>含义</h2><p>天公下棋，不动心也不动手，人却自然输了。不是天要与人较劲，而是阴阳的定律要平均，人们作的事情过了分，就是失了平均。抛出去的力，终究回到自己身上。所以《书经》说‘天作孽，犹可违；自作孽，不可活’，孟子说‘出乎尔者，反乎尔者也’，与佛经‘自造因，自结果’同一道理。 </p><h2>印证</h2><p>书中富家聚敛愈多败落愈快，范仲淹等肯输棋的人反而子孙贵盛贤才。原文说，发了几十万、几万万财的人，被天动了一著就都输完了。因果不是远方的报应，是眼前自己在承受的回力。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 自作自受之理</li><li><span class=\"wiki\" data-id=\"持盈保泰\">持盈保泰</span> — 抛力越大回力越大</li><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 此喻出自中篇</li></ul>", "deg": 3}, {"id": "积善余庆", "type": "义理", "summary": "《易经》说‘积善之家，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>《易经》说‘积善之家，必有余庆；积不善之家，必有余殃’。序一、上篇、下篇都引此义，附录一也重提此语。 </p><h2>含义</h2><p>余庆余殃不是一句安慰话，而是说善恶的影响不止及身，还会及于子孙；个人果报之外还有共同业报，彼此交互成一张业力网，难以独善其身。替子孙打算，不是多留钱，而是多留德。古人说余庆，重在后人还能守住这份善心。 </p><h2>印证</h2><p>乐山公行医济世、轻财仗义，子孙数代发科第；曾国藩不取一钱、家规从简，后人多能读书上进；范仲淹捐宅为学宫、俸钱布施，八百年后苏州范氏仍有优秀分子。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 余庆余殃的根据</li><li><span class=\"wiki\" data-id=\"阴德\">阴德</span> — 善不论人知与否</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 全书的核心信念</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 积善余庆的实证</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 不积钱而后人贤</li><li><span class=\"wiki\" data-id=\"范仲淹\">范仲淹</span> — 舍财而子孙贵盛</li></ul>", "deg": 14}, {"id": "致中和", "type": "义理", "summary": "中篇引《中庸》‘致中和，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇引《中庸》‘致中和，天地位焉，万物育焉’，并以天道一阴一阳的平均解释中和。 </p><h2>含义</h2><p>天道一阴一阳的平均就是中道、中和。人事失去平和，就会引起天道的变化；战争饥荒等大劫数，源于人事不公平、人心不中和。不是天要罚人，而是失衡必然回复到平均。人与人的斗争、国与国的斗争，结局仍是两败俱伤。圣人教人常立在吃亏的地位，正是守住中和的法子。 </p><h2>印证</h2><p>原文说男女数目永远平均，可证天道的公平与阴阳中和的自然调整力。若天理没有裁制调整的力量，强的巧的便永远富贵，善人也永不会抬头。仗着本领违反中和，终究自己吃苦头。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 中和的盈虚消长</li><li><span class=\"wiki\" data-id=\"谦德\">谦德</span> — 谦则心和</li><li><span class=\"wiki\" data-id=\"中篇\">中篇</span> — 此义出自中篇</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 失衡即招果报</li></ul>", "deg": 4}, {"id": "谦德", "type": "义理", "summary": "中篇引《易经》‘天道亏盈而益谦’、《尚书》‘满招损，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>中篇引《易经》‘天道亏盈而益谦’、《尚书》‘满招损，谦受益’，并说众善都含有谦德的意义，都以谦德为基本。 </p><h2>含义</h2><p>谦不是客套，是义务心重、权利心轻；重利轻义正是它的反面。由谦发动，对父母兄弟就是孝弟，对社会人群就是忠信礼义廉耻，所以说一切道德都在谦德里。不是把自己看小，而是不把别人看轻。对无力可怜的人心存慈愍、设法帮助，也是谦的一种表现。 </p><h2>印证</h2><p>乾卦‘能利天下，而不言所利’，坤卦‘坤虽有美，含之以从王事，不敢成也’；《金刚经》说‘布施济众，不觉有施’，都是才华不露、功名不居。原文说天道的降福降祸，说是天道，实是人情。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 谦德所顺的天道</li><li><span class=\"wiki\" data-id=\"致中和\">致中和</span> — 谦使心气平和</li><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 保富者的心地</li><li><span class=\"wiki\" data-id=\"反者道之动\">反者道之动</span> — 谦是倒过来的做法</li></ul>", "deg": 6}, {"id": "财布施与悭贪", "type": "义理", "summary": "上篇引《药师经》：‘见乞者来，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>上篇引《药师经》：‘见乞者来，其心不喜；设不得已而行施时，如割身肉，心生痛惜。如此之人，由此命终，生饿鬼界，或畜生道。’下篇、附录一续论发心。 </p><h2>含义</h2><p>悭贪不是节俭，是把本可救人的财守成一念执著。原文说富人见灾不救，如见孩童将落井而不救，近乎间接杀人。布施也不是买名声，而是心里真愿意舍；发心真切，钱少功德也大。 </p><h2>印证</h2><p>范仲淹以俸禄布施、乐山公义诊赠药，子孙昌盛；哈同遗产八万万，连年息尾数也不肯用于救难，周翁自道致富‘止是积而不用’，遗产三千万十余年败尽。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 悭贪是保富的反面</li><li><span class=\"wiki\" data-id=\"哈同\">哈同</span> — 有财不施之例</li><li><span class=\"wiki\" data-id=\"周翁\">周翁</span> — 积而不用之例</li><li><span class=\"wiki\" data-id=\"范仲淹\">范仲淹</span> — 布施济众之例</li><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 义诊赠药之例</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 舍与不舍各有其果</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 用财的正面之路</li></ul>", "deg": 13}, {"id": "阴德", "type": "义理", "summary": "序三引太仓陆毅氏之言：‘造物之鉴人也，", "content": "<p>tags: [义理] </p><h2>出处</h2><p>序三引太仓陆毅氏之言：‘造物之鉴人也，为善者，欲其不令人知；为不善者，欲其令人知。为善不令人知，阴德是也，故食报必丰。’ </p><h2>含义</h2><p>阴德不是暗地里做给人看的善，而是为善不想让人知道。存心是根本，人知与否在其次。为不善者反要令人知；善与恶的分别，不在形迹，而在那一念是给别人，还是给自己。为善而求人知，便已是在求报；不求人知，才是存心于善。 </p><h2>印证</h2><p>序三所记巨公借在山之势，遣人四方索币赋，取财使人不知其为恶，其事与种德者相反，其报亦酷——半年中三代沦亡。巧取虽能掩人耳目，掩不住因果。原文称此事足为巧于取财者之戒、仕路前车。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"积善余庆\">积善余庆</span> — 阴德是余庆之因</li><li><span class=\"wiki\" data-id=\"巨公\">巨公</span> — 取财于阴的反例</li><li><span class=\"wiki\" data-id=\"序三\">序三</span> — 此义出自序三</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 存心即造因</li></ul>", "deg": 4}, {"id": "上篇", "type": "篇章", "summary": "全书最长的一篇，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>全书最长的一篇，从作者居上海五十余年的见闻讲起。主旨只有一句：发财不难，保财最难。 </p><h2>要点</h2><ul><li>四五十年前的有钱人，如今家事全败、子孙能读书务正业的，百家难得一两家；中兴时代的文武各家也多凋零。</li><li>正面是曾国藩不取军中一钱、禁家人领盐票，范仲淹置义田、捐南园为学宫，耶律楚材只取大黄治疫，林则徐焚烟而身后无蓄。</li><li>反面是伍潘孔三家靠鸦片发财而后人无闻，周翁「积而不用」遗产三千万十余年败尽，陈某夸耀古铜七年后破产，哈同有八万万遗产却不肯拔一毛救人。</li><li>结论不是机巧，而是智慧眼光：辽远的见识与宏大的心量。</li></ul><h2>金句</h2><p>发财不难，保财最难。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 本篇提出全书总纲</li><li><span class=\"wiki\" data-id=\"曾国藩\">曾国藩</span> — 不取巧发财的样本</li><li><span class=\"wiki\" data-id=\"范仲淹\">范仲淹</span> — 布施济众的样本</li><li><span class=\"wiki\" data-id=\"耶律楚材\">耶律楚材</span> — 淡泊无蓄的样本</li><li><span class=\"wiki\" data-id=\"林则徐\">林则徐</span> — 有财不取的样本</li><li><span class=\"wiki\" data-id=\"哈同\">哈同</span> — 积财不施的反面</li><li><span class=\"wiki\" data-id=\"周翁\">周翁</span> — 积而不用的反面</li><li><span class=\"wiki\" data-id=\"陈某\">陈某</span> — 夸富速败的反面</li><li><span class=\"wiki\" data-id=\"伍秉鉴\">伍秉鉴</span> — 鸦片致富的反面</li><li><span class=\"wiki\" data-id=\"智慧眼光\">智慧眼光</span> — 本篇归结的保富关键</li></ul>", "deg": 10}, {"id": "下篇", "type": "篇章", "summary": "一九四三年四月聂云台卧病续写。", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>一九四三年四月聂云台卧病续写。原想广搜古人积德的故事，后来改写自家七世祖乐山公，以一家之事作为全书的实证。 </p><h2>要点</h2><ul><li>因编《先母崇德老夫人纪念册》，特意写了「七世祖乐山公行医济世善行的果报」；乐山公善行载于府县志，堪作取信社会的佐证。</li><li>乐山公医术精而轻财仗义：药店被窃，抵押住房还债；八十多岁大雪夜仍穿木屐出诊救人。舍己利人，两百年来荫庇子孙。</li><li>先焘公中进士、任陕西镇安县县长，乐山公寄信教以爱民治世，信被巡抚陈文恭刊发全省；亦峰公居官廉洁，宽厚处理械斗巨案，保全很多人。</li><li>作者自述愧对祖先，撰祖德以告后人。乐山公不曾发财，却能够「发身」；子孙四代发科第，至第七代仍承余荫，超过孟子所说的五代。</li></ul><h2>金句</h2><p>仁者以财发身，不仁者以身发财。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"乐山公\">乐山公</span> — 本篇的核心实证</li><li><span class=\"wiki\" data-id=\"亦峰公\">亦峰公</span> — 承续祖德的第五代</li><li><span class=\"wiki\" data-id=\"先焘公\">先焘公</span> — 受父教爱民治世</li><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 本篇作者与第七代后人</li><li><span class=\"wiki\" data-id=\"以财发身\">以财发身</span> — 本篇要证明的道理</li><li><span class=\"wiki\" data-id=\"五世而斩\">五世而斩</span> — 德泽超越五代的对照</li></ul>", "deg": 8}, {"id": "中篇", "type": "篇章", "summary": "一九四二年六月聂云台卧病所书。", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>一九四二年六月聂云台卧病所书。讲的是天道，不是手段：先看清盈虚消长，再把道理落到起心动念上。 </p><h2>要点</h2><ul><li>《易经》说「一阴一阳之谓道」：有日必有夜，有潮涨就有潮落。人事的盛衰苦乐虽随人心变化，仍依这天道的定则。</li><li>阳极则阴生，阴极则阳生，盛极必衰。明白的人常立在吃亏的地位，谦卑退让、舍财不贪；看似吃亏，后来仍得大便宜。</li><li>世间事如下棋：我动一著，对方必应，还有第二三著跟来。对人赢得愈大，对天输得愈厉害，这叫「人有千算，天止一算」。</li><li>天道的平均就是中和，《中庸》说「致中和，天地位焉，万物育焉」。一切道德都在谦德里：对父母兄弟是孝弟，对社会人群是忠信礼义廉耻。说是天降，实由自作。</li></ul><h2>金句</h2><p>满招损，谦受益，时乃天道。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 中篇所用义理支撑全书</li><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 本篇的核心法则</li><li><span class=\"wiki\" data-id=\"致中和\">致中和</span> — 阴阳平均即中道</li><li><span class=\"wiki\" data-id=\"谦德\">谦德</span> — 一切道德的根本</li><li><span class=\"wiki\" data-id=\"下棋喻\">下棋喻</span> — 本篇用来说明感应</li><li><span class=\"wiki\" data-id=\"反者道之动\">反者道之动</span> — 与世俗之见相反的功夫</li><li><span class=\"wiki\" data-id=\"下有千算天止一算\">下有千算天止一算</span> — 赢人而输天的警句</li></ul>", "deg": 8}, {"id": "书后", "type": "篇章", "summary": "一九四七年十一月聂云台作，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>一九四七年十一月聂云台作，抄录顾亭林论奢靡影响政治的史实，为《保富法》补上社会风气的维度。 </p><h2>要点</h2><ul><li>国家风气奢靡，为政者应以崇尚俭朴来转移风气。顾亭林说「天下安危，匹夫之贱，与有责任」，个人行事也能影响政治。</li><li>许劭使袁绍屏去车马随从，蔡充令刘整自惭庸俗，李德林、李僧伽使崔谌、袁叔德沿途减从：俭德不必高声，自能化人。</li><li>杨绾拜相当日，崔宽自行拆毁号称天下第一的楼台，郭子仪裁减家中乐伎五分之四；官高势盛者，反而敬畏俭朴。</li><li>惟俭可以养廉，奢侈则不能不贪污。作者盼保存俭朴古风，对欧美文明择善取舍，不照单全收。</li></ul><h2>金句</h2><p>惟俭可以养廉。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"顾亭林\">顾亭林</span> — 本篇所抄论点的来源</li><li><span class=\"wiki\" data-id=\"杨绾\">杨绾</span> — 以俭德化人的宰相</li><li><span class=\"wiki\" data-id=\"郭子仪\">郭子仪</span> — 闻杨绾拜相而减乐伎</li><li><span class=\"wiki\" data-id=\"俭以养廉\">俭以养廉</span> — 本篇归结的政风之理</li></ul>", "deg": 5}, {"id": "序一", "type": "篇章", "summary": "傅益永一九九五年八月写于台北，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>傅益永一九九五年八月写于台北，时年八十二。这篇序不是替人算命，而是把《保富法》放回因果与命运的背景里：命运不在别处，在自己手里。 </p><h2>要点</h2><ul><li>从某个角度看人生，往后是无尽苦难，向前是一片茫茫。稍有思想，总要趋吉避凶，这是人的本能。</li><li>所谓「命由我作，福自己求」，不怨天、不尤人，都是自业自得；深信因果、行善积德，才是改造命运最好的途径。</li><li>世人所求莫非名利，毛病不在求，而在只知自己的名利，否定并伤害别人的正当名利。作者举末代帝王、二战独裁者，以及菲律宾、韩国等权贵为例：一念贪心，报应不必等到二三代。</li><li>《保富法》凭集体范例，《了凡四训》凭个人资料，两书宗旨相同，互相扩大证明因果。</li><li>说食不饱，道理救不了人；要改命运，靠有「良知」与「人性」的理智行动。</li></ul><h2>金句</h2><p>命由我作，福自己求 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 序文所推介的集体范例之书</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 序文用来解释命运的法则</li><li><span class=\"wiki\" data-id=\"编者的话\">编者的话</span> — 同年台北写成的另一篇导读</li></ul>", "deg": 3}, {"id": "序三", "type": "篇章", "summary": "丁福保一九四三年四四儿童节写于无锡，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>丁福保一九四三年四四儿童节写于无锡，时年七十。此序一面记《保富法》登《申报》后的回响，一面引古人事例，把因果轮回讲透。 </p><h2>要点</h2><ul><li>黄警顽将稿刊于《申报》，读者数日间捐入申报读者助学金四十七万五千余元，可见此书劝化之力。</li><li>引太仓陆毅氏所述某巨公：才略卓然，借在山之势遣人四方索币赋，取财使人不知其为恶；不久两孙夭、一子随之、巨公亦殁，半年中三代沦亡。这是巧于取财者的前车。</li><li>若肯照书中之法，既积而复散，本可化奇祸为钜福；可惜夙孽深者虽读不信，甚至背道而驰。</li><li>世人多不知幽明之理，以为人死断灭，便放胆造十恶；不知业报轻重如五雀六燕之铢两称，毫厘不差。</li></ul><h2>金句</h2><p>为善不令人知，阴德是也，故食报必丰。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"巨公\">巨公</span> — 序中所引巧取致祸的例子</li><li><span class=\"wiki\" data-id=\"阴德\">阴德</span> — 善不欲人知，故食报必丰</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 序文劝世所本的轮回之理</li><li><span class=\"wiki\" data-id=\"序二\">序二</span> — 同论天道亏盈的书前序文</li></ul>", "deg": 4}, {"id": "序二", "type": "篇章", "summary": "卓贶来一九九零年六月写于台北。", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>卓贶来一九九零年六月写于台北。抗战期间他在上海租界读东吴大学，课余常听舅父聂云台教益，此序便从当年上海的奢华风气说起。 </p><h2>要点</h2><ul><li>世人大都贪财，想尽办法权谋巧算以求富；富了之后骄奢淫逸、悭贪自肥，却不知保富。贪财而不施舍，利己而不积德利人。</li><li>天道亏盈而益谦：过分的必受制裁，吃亏的必受补益。这不是消极退让，而是看清满与损之间的定则。</li><li>作者对照今日台湾：经济成长、所得提高，却贫富差距增大，治安恶化，昔日千万富翁沦为狱中犯人，商场名人因经济犯罪四处逃避。</li><li>若能由此觉悟亏盈、益谦与因果，开启慧眼、放远见识、宽大心量，这本书就不只是保富法，也是保福法。</li></ul><h2>金句</h2><p>天道亏盈而益谦；满招损，谦受益 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 序文认定的保富兼保福之书</li><li><span class=\"wiki\" data-id=\"天道亏盈益谦\">天道亏盈益谦</span> — 序文点出的核心天道</li><li><span class=\"wiki\" data-id=\"序三\">序三</span> — 同属书前序文，互为参照</li></ul>", "deg": 3}, {"id": "编者的话", "type": "篇章", "summary": "整理者王潮音写于一九九五年八月十日的台北，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>整理者王潮音写于一九九五年八月十日的台北，是全书的第一道门。它不是客套的序，而是一句催促：这本书要细读，别让一生为家人为自己所忙，最后落得白忙一场。 </p><h2>要点</h2><ul><li>数年前曾走马看花读过一次，只觉有道理；近日重读，内心受到汹涌澎湃、前所未有的冲激，于是盼望每个人都详细读这本宝书。</li><li>原书写于一九四二、三年。上、中两篇和附录二本用白话写成，仍需重新整理；下篇、书后及附录一是文言，故加翻译。</li><li>聂先生把一生所见所闻融合历史教训编成此书，用心不在教人聚财，而在提醒世人如何真正保有财富，避免重蹈贪财者的覆辙。</li><li>结尾赠言落在智者一边：保富也是保福。</li></ul><h2>金句</h2><p>天妒英才尤忌财，为何钱财保不住； </p><p>聪明反彼聪明误，智者保富亦保福。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"保富法\">保富法</span> — 编者劝人细读的那本书</li><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 本书作者，用心在保富亦保福</li><li><span class=\"wiki\" data-id=\"序一\">序一</span> — 同在一九九五年台北写成的导读</li></ul>", "deg": 3}, {"id": "附录一", "type": "篇章", "summary": "节录云台居士卧病随笔，", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>节录云台居士卧病随笔，全书最短的一篇。它讲的不是方法，而是发心：心若不在，钱再多也无用。 </p><h2>要点</h2><ul><li>财富之来不觉而来，之去也不觉而去；用尽计谋，实在白费心机，其中因果相当复杂。</li><li>一切善事，重点在发心，金额多少还在其次。发心真切而力量不及，钱少功德极大；缺乏真实慈愍心，钱多功德很小。</li><li>子女的智慧愚蠢、贤良不肖，教育影响也实在有限；体格寿夭，医药也不是决定因素。要多培养慈悲心，以利人济物为处世目标，子孙才能享幸福。</li><li>子孙的学问事业受父母积德修福影响；祖上若刻薄成家，学业即使侥幸有成，终究不会发达长远。宜常置《德育古鉴》于案头，《了凡四训》也值得参考。</li></ul><h2>金句</h2><p>一切的善事，重点在于发心，而金额的多少，还在其次。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"聂云台\">聂云台</span> — 随笔的作者</li><li><span class=\"wiki\" data-id=\"发心为重\">发心为重</span> — 本篇的核心主张</li><li><span class=\"wiki\" data-id=\"因果报应\">因果报应</span> — 培养慈悲心先要明白的道理</li></ul>", "deg": 3}, {"id": "附录二", "type": "篇章", "summary": "原为聂云台一九四六年八月刊于《读书通讯》第一百四十一期的旧作「色情刊物与跳舞」。", "content": "<p>tags: [篇章] </p><h2>定位</h2><p>原为聂云台一九四六年八月刊于《读书通讯》第一百四十一期的旧作「色情刊物与跳舞」。表面谈风气，实谈身心与效能。 </p><h2>要点</h2><ul><li>荷兰注重礼教、严男女之防，宝石城监狱长年空虚；美国放纵盛行，犯罪、离婚、花柳病激增。作者引犯罪学者的报告，指色情刊物与跳舞为导因。</li><li>泰勒研究三十多家工厂，发现职工效能星期一最低，原因是星期日跳舞纵乐，到星期二上午还未恢复。这类娱乐不是养精神，而是减精力。</li><li>增进身心效能有两条路：生理要锻炼，心理要存养。曾国藩主敬习劳，陶侃运甓，董仲舒下帷，勾践卧薪；诸葛亮说淡泊明志、宁静致远。</li><li>所谓科学眼光，是以冷静头脑观察客观事实；主观嗜欲一强，眼光便消失。</li></ul><h2>金句</h2><p>非淡泊，无以明志；非宁静，无以致远。 </p><h2>相关</h2><ul><li><span class=\"wiki\" data-id=\"俭以养廉\">俭以养廉</span> — 节制嗜欲，与养廉同理</li><li><span class=\"wiki\" data-id=\"陶侃\">陶侃</span> — 运甓励志的例证</li><li><span class=\"wiki\" data-id=\"诸葛亮\">诸葛亮</span> — 淡泊宁静的例证</li><li><span class=\"wiki\" data-id=\"勤苦修身\">勤苦修身</span> — 本篇所举的身心修养原则</li></ul>", "deg": 4}], "edges": [{"s": 0, "t": 1}, {"s": 0, "t": 3}, {"s": 0, "t": 11}, {"s": 0, "t": 20}, {"s": 0, "t": 21}, {"s": 0, "t": 22}, {"s": 0, "t": 26}, {"s": 0, "t": 32}, {"s": 0, "t": 35}, {"s": 0, "t": 38}, {"s": 1, "t": 3}, {"s": 1, "t": 11}, {"s": 1, "t": 21}, {"s": 1, "t": 32}, {"s": 1, "t": 38}, {"s": 2, "t": 9}, {"s": 2, "t": 32}, {"s": 2, "t": 35}, {"s": 2, "t": 37}, {"s": 3, "t": 38}, {"s": 4, "t": 22}, {"s": 4, "t": 32}, {"s": 4, "t": 35}, {"s": 4, "t": 37}, {"s": 5, "t": 22}, {"s": 5, "t": 27}, {"s": 5, "t": 32}, {"s": 5, "t": 35}, {"s": 5, "t": 37}, {"s": 6, "t": 27}, {"s": 6, "t": 35}, {"s": 6, "t": 36}, {"s": 6, "t": 42}, {"s": 7, "t": 11}, {"s": 7, "t": 20}, {"s": 7, "t": 21}, {"s": 7, "t": 22}, {"s": 7, "t": 29}, {"s": 7, "t": 30}, {"s": 7, "t": 32}, {"s": 7, "t": 34}, {"s": 7, "t": 37}, {"s": 7, "t": 38}, {"s": 8, "t": 14}, {"s": 8, "t": 23}, {"s": 8, "t": 40}, {"s": 9, "t": 21}, {"s": 9, "t": 22}, {"s": 9, "t": 32}, {"s": 9, "t": 37}, {"s": 10, "t": 21}, {"s": 10, "t": 22}, {"s": 10, "t": 32}, {"s": 10, "t": 35}, {"s": 10, "t": 37}, {"s": 11, "t": 22}, {"s": 11, "t": 38}, {"s": 11, "t": 40}, {"s": 11, "t": 44}, {"s": 11, "t": 45}, {"s": 12, "t": 21}, {"s": 12, "t": 22}, {"s": 12, "t": 30}, {"s": 12, "t": 32}, {"s": 12, "t": 35}, {"s": 12, "t": 37}, {"s": 13, "t": 16}, {"s": 13, "t": 24}, {"s": 13, "t": 46}, {"s": 14, "t": 23}, {"s": 14, "t": 40}, {"s": 15, "t": 30}, { const SUBTITLE={"人物": "人物 · 史实例证", "义理": "义理 · 核心法则", "篇章": "篇章 · 原书结构"};
const NS="http://www.w3.org/2000/svg";
const app=document.getElementById("app");
const stage=document.getElementById("stage");
const resizer=document.getElementById("resizer");
const svg=document.getElementById("svg"), vp=document.getElementById("viewport");
const gE=document.getElementById("edges"), gN=document.getElementById("nodes");
const W=()=>svg.clientWidth||1, H=()=>svg.clientHeight||1;
const N=DATA.nodes.length;
const deg=DATA.nodes.map(n=>n.deg), maxDeg=Math.max.apply(null,deg);
const radius=i=>6+15*Math.sqrt(deg[i]/maxDeg);
const MAJOR_N=18;
const majorSet=new Set([...DATA.nodes].sort((a,b)=>b.deg-a.deg).slice(0,MAJOR_N).map(n=>n.id));
const midSet=new Set([...DATA.nodes].sort((a,b)=>b.deg-a.deg).slice(MAJOR_N,MAJOR_N+22).map(n=>n.id));
const sorted=[...DATA.nodes].sort((a,b)=>b.deg-a.deg);
const layerOf={}; sorted.forEach((n,k)=>layerOf[n.id]=k);
const nodes=DATA.nodes.map((n,i)=>{
  const k=layerOf[n.id], ring=k<8?90:k<18?180:k<35?270:360, a=k*2.39996;
  return {i,id:n.id,type:n.type,summary:n.summary,content:n.content,deg:n.deg,
    x:W()/2+Math.cos(a)*ring,y:H()/2+Math.sin(a)*ring,vx:0,vy:0,fx:null,fy:null};
});
const idx={}; nodes.forEach(n=>idx[n.id]=n);
const edges=DATA.edges.map(e=>({s:nodes[e.s],t:nodes[e.t]}));
const edgeEls=edges.map(e=>{const l=document.createElementNS(NS,"line");l.setAttribute("class","edge");gE.appendChild(l);return l;});
const nodeEls=nodes.map(n=>{
  const g=document.createElementNS(NS,"g");g.setAttribute("class","node "+(majorSet.has(n.id)?"major":midSet.has(n.id)?"mid":"minor"));
  const hit=document.createElementNS(NS,"circle");hit.setAttribute("r",Math.max(radius(n.i)+4,14));
  hit.setAttribute("fill","rgba(0,0,0,0)");hit.setAttribute("class","hit");
  const c=document.createElementNS(NS,"circle");c.setAttribute("r",radius(n.i));
  c.setAttribute("fill",n.type==="人物"?"#3f5ea8":n.type==="义理"?"#a9854f":"#c96a3b");
  const t=document.createElementNS(NS,"text");t.setAttribute("class","lbl");
  t.setAttribute("text-anchor","middle");t.setAttribute("dy",-radius(n.i)-5);t.textContent=n.id;
  g.appendChild(hit);g.appendChild(c);g.appendChild(t);gN.appendChild(g);return {g,c,t,hit};
});
let scale=1,tx=0,ty=0;
function applyTransform(){vp.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`);}
let graphActive=true;
function tick(){
  requestAnimationFrame(tick);
  if(!graphActive) return;
  const cx=W()/2,cy=H()/2;
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+0.1,d=Math.sqrt(d2);
    let f=Math.min(2600/d2,7.5),ux=dx/d,uy=dy/d;
    nodes[i].vx+=ux*f;nodes[i].vy+=uy*f;nodes[j].vx-=ux*f;nodes[j].vy-=uy*f;
  }
  edges.forEach(e=>{let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.sqrt(dx*dx+dy*dy)+0.01;
    let f=(d-125)*0.011,ux=dx/d,uy=dy/d;e.s.vx+=ux*f;e.s.vy+=uy*f;e.t.vx-=ux*f;e.t.vy-=uy*f;});
  nodes.forEach(n=>{if(n.fx!==null){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;return;}
    n.vx+=(cx-n.x)*0.0012;n.vy+=(cy-n.y)*0.0012;n.vx*=0.85;n.vy*=0.85;n.x+=n.vx;n.y+=n.vy;});
  render();
}
function render(){
  edgeEls.forEach((l,i)=>{l.setAttribute("x1",edges[i].s.x);l.setAttribute("y1",edges[i].s.y);l.setAttribute("x2",edges[i].t.x);l.setAttribute("y2",edges[i].t.y);});
  nodeEls.forEach((el,i)=>el.g.setAttribute("transform",`translate(${nodes[i].x},${nodes[i].y})`));
}
let dragNode=null,panning=false,lastX=0,lastY=0,moved=false,downX=0,downY=0;
function toWorld(ev){const rc=svg.getBoundingClientRect();return {x:(ev.clientX-rc.left-tx)/scale,y:(ev.clientY-rc.top-ty)/scale};}
nodeEls.forEach((el,i)=>{
  const n=nodes[i];
  el.hit.addEventListener("mousedown",ev=>{ev.stopPropagation();dragNode=n;n.fx=n.x;n.fy=n.y;moved=false;downX=ev.clientX;downY=ev.clientY;svg.classList.add("dragging");});
  el.g.addEventListener("click",ev=>{ev.stopPropagation();if(!moved)select(n.id);});
  el.g.addEventListener("mouseenter",()=>{if(!selected)hoverFocus(n.id);el.g.classList.add("hovered");});
  el.g.addEventListener("mouseleave",()=>{el.g.classList.remove("hovered");if(!selected)clearHover();});
  el.hit.addEventListener("touchstart",ev=>{
    ev.stopPropagation();
    const t=ev.touches[0];dragNode=n;n.fx=n.x;n.fy=n.y;
    moved=false;downX=t.clientX;downY=t.clientY;
  },{passive:true});
  el.hit.addEventListener("touchmove",ev=>{
    ev.stopPropagation();
    const t=ev.touches[0];
    if(Math.abs(t.clientX-downX)+Math.abs(t.clientY-downY)>8)moved=true;
    const w=toWorld(t);dragNode.fx=w.x;dragNode.fy=w.y;
  },{passive:true});
  el.hit.addEventListener("touchend",ev=>{
    ev.stopPropagation();
    if(dragNode){dragNode.fx=null;dragNode.fy=null;dragNode=null;}
    if(!moved){select(n.id);}
  },{passive:true});
});
function clearHover(){nodeEls.forEach(el=>el.g.classList.remove("hot","dim"));edgeEls.forEach(l=>l.classList.remove("hot","dim"));}
function hoverFocus(id){const nb=neighbors(id);
  nodeEls.forEach((el,i)=>{el.g.classList.toggle("hot",nb.has(nodes[i].id)&&nodes[i].id!==id);el.g.classList.toggle("dim",!nb.has(nodes[i].id));});
  edgeEls.forEach((l,i)=>{const e=edges[i],hot=(e.s.id===id||e.t.id===id);l.classList.toggle("hot",hot);l.classList.toggle("dim",!hot);});}
svg.addEventListener("mousedown",ev=>{panning=true;lastX=ev.clientX;lastY=ev.clientY;moved=false;svg.classList.add("dragging");});
window.addEventListener("mousemove",ev=>{
  if(dragNode){const w=toWorld(ev);dragNode.fx=w.x;dragNode.fy=w.y;if(Math.abs(ev.clientX-downX)+Math.abs(ev.clientY-downY)>4)moved=true;}
  else if(panning){tx+=ev.clientX-lastX;ty+=ev.clientY-lastY;lastX=ev.clientX;lastY=ev.clientY;applyTransform();}});
window.addEventListener("mouseup",()=>{if(dragNode){dragNode.fx=null;dragNode.fy=null;}dragNode=null;panning=false;svg.classList.remove("dragging");});
function zoomAt(mx,my,k){const ns=Math.max(.25,Math.min(4,scale*k));tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;applyTransform();}
svg.addEventListener("wheel",ev=>{ev.preventDefault();const rc=svg.getBoundingClientRect();zoomAt(ev.clientX-rc.left,ev.clientY-rc.top,ev.deltaY<0?1.12:0.89);},{passive:false});
/* 手机触摸：双指捏合缩放 + 单指平移画布（节点自身触摸已 stopPropagation，互不冲突） */
let pinch=null,touchPan=null;
svg.addEventListener("touchstart",ev=>{
  if(ev.touches.length===2){
    // 双指开始时取消节点拖动，避免捏合时误拖节点
    if(dragNode){dragNode.fx=null;dragNode.fy=null;dragNode=null;}
    const t0=ev.touches[0],t1=ev.touches[1],rc=svg.getBoundingClientRect();
    pinch={dist:Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY)||1,
      cx:(t0.clientX+t1.clientX)/2-rc.left,cy:(t0.clientY+t1.clientY)/2-rc.top};
    touchPan=null;
  }else if(ev.touches.length===1&&!pinch){const t=ev.touches[0];touchPan={x:t.clientX,y:t.clientY};}
},{passive:true});
svg.addEventListener("touchmove",ev=>{
  if(ev.touches.length===2&&pinch){
    ev.preventDefault();
    const t0=ev.touches[0],t1=ev.touches[1],rc=svg.getBoundingClientRect();
    const d=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
    const cx=(t0.clientX+t1.clientX)/2-rc.left,cy=(t0.clientY+t1.clientY)/2-rc.top;
    zoomAt(cx,cy,d/pinch.dist);
    tx+=cx-pinch.cx;ty+=cy-pinch.cy;applyTransform();
    pinch.dist=d;pinch.cx=cx;pinch.cy=cy;
  }else if(ev.touches.length===1&&touchPan&&!dragNode){
    const t=ev.touches[0];tx+=t.clientX-touchPan.x;ty+=t.clientY-touchPan.y;
    touchPan={x:t.clientX,y:t.clientY};applyTransform();
  }
},{passive:false});
svg.addEventListener("touchend",ev=>{
  if(ev.touches.length<2)pinch=null;
  if(ev.touches.length===0)touchPan=null;
  else if(ev.touches.length===1){const t=ev.touches[0];touchPan={x:t.clientX,y:t.clientY};}
},{passive:true});
let selected=null,filter="all",query="",labelsMinimal=false,edgesOn=true;
function neighbors(id){const s=new Set([id]);edges.forEach(e=>{if(e.s.id===id)s.add(e.t.id);if(e.t.id===id)s.add(e.s.id);});return s;}
function typeOK(n){return filter==="all"||n.type===filter;}
function refresh(){
  const focus=selected?neighbors(selected):null,q=query.trim();
  nodeEls.forEach((el,i)=>{const n=nodes[i],show=typeOK(n)&&(!q||n.id.indexOf(q)>=0),inFocus=!focus||focus.has(n.id);
    el.g.classList.toggle("dim",!(show&&inFocus));el.g.classList.toggle("sel",selected===n.id);
    el.g.classList.toggle("hot",!!focus&&inFocus&&selected!==n.id);});
  edgeEls.forEach((l,i)=>{const e=edges[i],show=typeOK(e.s)&&typeOK(e.t)&&(!q||(e.s.id.indexOf(q)>=0||e.t.id.indexOf(q)>=0)),hot=focus&&(e.s.id===selected||e.t.id===selected);
    l.classList.toggle("dim",!(show&&(!focus||hot)));l.classList.toggle("hot",!!hot);});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function select(id){
  // 手机端：点击节点即收起图谱，进入沉浸式全屏阅读
  if(window.matchMedia("(max-width:680px)").matches&&!graphHidden)hideGraph();
  selected=id;refresh();const n=idx[id];
  document.querySelector("#panel h1").textContent=n.id;
  document.querySelector("#panel .sub").textContent=SUBTITLE[n.type]||"";
  const links=[...neighbors(id)].filter(x=>x!==id).sort((a,b)=>idx[b].deg-idx[a].deg);
  document.getElementById("pb").innerHTML=`<div class="reader">`+
    `<span class="badge ${n.type==='人物'?'p':n.type==='义理'?'y':'e'}">${n.type}</span>`+
    (n.summary?`<p class="sum">${esc(n.summary)}</p>`:"")+
    `<div class="meta-row"><div>连接度<b>${n.deg}</b></div><div>关联节点<b>${links.length}</b></div></div>`+
    `<div class="md-content">${n.content}</div>`+
    `<p class="rel-title">关联节点 · ${links.length}</p>`+
    `<div class="rel">${links.map(l=>`<span class="chip ${idx[l].type==='人物'?'p':idx[l].type==='义理'?'y':'e'}" data-id="${esc(l)}">${esc(l)}</span>`).join("")}</div>`+
    `</div>`;
  const pb=document.getElementById("pb");
  pb.querySelectorAll(".chip").forEach(c=>c.onclick=()=>select(c.dataset.id));
  pb.querySelectorAll(".wiki").forEach(w=>{const tid=w.dataset.id;if(idx[tid])w.onclick=()=>select(tid);else w.classList.add("miss");});
  pb.scrollTop=0;
}
function clearSel(){selected=null;overview();refresh();}
function overview(){
  const pc=nodes.filter(n=>n.type==="人物").length,yc=nodes.filter(n=>n.type==="义理").length,ec=nodes.filter(n=>n.type==="篇章").length;
  const top=[...nodes].sort((a,b)=>b.deg-a.deg).slice(0,10),mx=top[0].deg;
  document.getElementById("stat").innerHTML=`共 <b>${N}</b> 个节点 · <b>${edges.length}</b> 条关系<br>人物 ${pc} · 义理 ${yc} · 篇章 ${ec}`;
  document.querySelector("#panel h1").textContent="保富法知识图谱";
  document.querySelector("#panel .sub").textContent="聂云台《保富法》· 基于双向链接生成";
  document.getElementById("pb").innerHTML=`<div class="reader">`+
    `<div class="empty"><div class="big">❦</div>点击任意节点，查看该页全文与关联。<br>节点越大关系越多；<span style="color:var(--person)">蓝=人物</span>，<span style="color:var(--yili)">金=义理</span>，<span style="color:var(--event)">橙=篇章</span>。</div>`+
    `<p class="rel-title">连接最广 · TOP 10</p><div class="top-list">`+
    top.map((n,i)=>`<div class="top-item" data-id="${esc(n.id)}"><span class="rank">${i+1}</span><span style="width:64px">${esc(n.id)}</span><span class="bar" style="width:${Math.round(n.deg/mx*150)}px"></span><span>${n.deg}</span></div>`).join("")+`</div>`+
    `</div>`;
  document.querySelectorAll("#pb .top-item").forEach(el=>el.onclick=()=>select(el.dataset.id));
}

/* ===== 图谱：水平滑动 / 隐藏 / 阅读最大化 ===== */
let graphHidden=false;
let lastGraphW=stage.getBoundingClientRect().width||Math.round(window.innerWidth*0.55);
let graphW=lastGraphW;
function setGraphWidth(px){
  graphActive=true;
  graphW=Math.max(240,Math.min(window.innerWidth-260,px));
  document.documentElement.style.setProperty("--graph-w",graphW+"px");
  lastGraphW=graphW;
}
function syncFab(){
  const fab=document.getElementById("fabGraph");if(!fab)return;
  fab.classList.toggle("on",!graphHidden);
  // 悬浮开关仅在「手机 + 图谱收起（阅读态）」显示；图谱全屏时隐藏，工具栏自带关闭按钮
  const mobile=window.matchMedia("(max-width:680px)").matches;
  fab.style.display=(mobile&&graphHidden)?"flex":"none";
}
function hideGraph(){
  if(graphHidden)return;
  graphHidden=true;app.classList.add("graph-hidden");graphActive=false;syncFab();
}
function showGraph(){
  if(!graphHidden)return;
  graphHidden=false;app.classList.remove("graph-hidden");
  document.documentElement.style.setProperty("--graph-w",lastGraphW+"px");
  graphActive=true;syncFab();
}
function toggleGraph(){graphHidden?showGraph():hideGraph();}
// 鼠标拖动
resizer.addEventListener("mousedown",ev=>{
  ev.preventDefault();app.classList.add("resizing");document.body.classList.add("resizing");
  const move=e=>setGraphWidth(e.clientX);
  const up=()=>{
    window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);
    app.classList.remove("resizing");document.body.classList.remove("resizing");
    if(graphW<300)hideGraph();
  };
  window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
});
// 触摸滑动
resizer.addEventListener("touchstart",ev=>{ev.preventDefault();app.classList.add("resizing");},{passive:false});
resizer.addEventListener("touchmove",ev=>{ev.preventDefault();setGraphWidth(ev.touches[0].clientX);},{passive:false});
resizer.addEventListener("touchend",()=>{app.classList.remove("resizing");if(graphW<300)hideGraph();});
// 双击 / 按钮 / 快捷键
resizer.addEventListener("dblclick",toggleGraph);
document.getElementById("hideGraphBtn").onclick=hideGraph;
document.getElementById("showGraphBtn").onclick=showGraph;
window.addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="h"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))toggleGraph();
});

/* ===== 原有控件绑定 ===== */
document.getElementById("clear").onclick=clearSel;
document.getElementById("reset").onclick=()=>{scale=1;tx=0;ty=0;applyTransform();
  nodes.forEach(n=>{const k=layerOf[n.id],ring=k<8?90:k<18?180:k<35?270:360,a=k*2.39996;
    n.x=W()/2+Math.cos(a)*ring;n.y=H()/2+Math.sin(a)*ring;n.vx=0;n.vy=0;n.fx=null;n.fy=null;});};
document.getElementById("edgeToggle").onclick=function(){edgesOn=!edgesOn;svg.classList.toggle("edges-off",!edgesOn);this.textContent=edgesOn?"隐藏连线":"显示连线";this.classList.toggle("on",!edgesOn);};
document.getElementById("labelToggle").onclick=function(){labelsMinimal=!labelsMinimal;
  svg.classList.toggle("labels-minimal",labelsMinimal);
  this.textContent=labelsMinimal?"精简标签":"全部标签";this.classList.toggle("on",!labelsMinimal);};
document.querySelectorAll(".seg .btn").forEach(b=>b.onclick=function(){
  document.querySelectorAll(".seg .btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  filter=b.dataset.f;selected=null;overview();refresh();});
document.getElementById("search").addEventListener("input",ev=>{query=ev.target.value;refresh();});

/* ===== 手机端：抽屉式图谱 ===== */
const isMobile=()=>window.matchMedia("(max-width:680px)").matches;
const fabGraph=document.getElementById("fabGraph");
const scrim=document.getElementById("scrim");
fabGraph.addEventListener("click",toggleGraph);
scrim.addEventListener("click",()=>{if(!graphHidden)hideGraph();});
// 屏幕边缘右滑展开图谱 / 图谱内左滑收起
let edgeStartX=null,edgeStartY=null,edgeFromLeft=false;
window.addEventListener("touchstart",ev=>{
  if(!isMobile())return;
  // 工具栏内的横向滑动只滚动按钮，不触发图谱侧滑手势
  if(ev.target.closest&&ev.target.closest("#bar")){edgeStartX=null;return;}
  const t=ev.touches[0];edgeStartX=t.clientX;edgeStartY=t.clientY;
  edgeFromLeft=t.clientX<28;
},{passive:true});
window.addEventListener("touchend",ev=>{
  if(!isMobile()||edgeStartX===null)return;
  const t=ev.changedTouches[0],dx=t.clientX-edgeStartX,dy=t.clientY-edgeStartY;
  if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.4){
    if(graphHidden&&edgeFromLeft&&dx>0){showGraph();}
    else if(!graphHidden&&dx<0){hideGraph();}
  }
  edgeStartX=null;
},{passive:true});

// 初次进入：手机端默认收起图谱，阅读最大化
if(isMobile()){graphHidden=false;hideGraph();}
syncFab();
overview();applyTransform();tick();
</script>
</body>
